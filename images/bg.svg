<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <filter id="paper" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.8"
      numOctaves="1"
      seed="3"
      stitchTiles="stitch"
      result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#f8f8f8" surfaceScale="3">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
  </filter>
  <rect width="300" height="300" filter="url(#paper)"/>
</svg>