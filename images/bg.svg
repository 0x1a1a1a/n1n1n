<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256">
  <filter
    id="noise"
    x="0%"
    y="0%"
    width="100%"
    height="100%"
  >
  <feTurbulence
    type="fractalNoise"
    baseFrequency="2"
    numOctaves="2"
    seed="777"
    stitchTiles="stitch"
  />
  <feColorMatrix
    type="matrix"
    values="
      3 0 0 0 -0.9
      3 0 0 0 -0.9
      3 0 0 0 -0.9
      0 0 0 0 1"
  />
  </filter>
  <rect
    width="256"
    height="256"
    fill="#ffffff"
  />
  <rect
    width="256"
    height="256"
    filter="url(#noise)"
    opacity="1"
  />
</svg>